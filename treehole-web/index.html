<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06060d" />
  <title>树洞 · 匿名分享你的故事</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.6c-3.7 0-6.4 2.5-6.4 6 0 2.2 1.1 3.7 2.2 4.7-.6.5-1.2 1.2-1.2 2.3h10.8c0-1.1-.6-1.8-1.2-2.3 1.1-1 2.2-2.5 2.2-4.7 0-3.5-2.7-6-6.4-6Z' fill='%235fe0bd'/><path d='M12 15.6V21M12 18.6l2.6-2M12 17.2l-2.3-1.8' stroke='%23a78bfa' stroke-width='1.6' stroke-linecap='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300..700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <script>
    // 首帧前确定主题，避免深色站点出现浅色闪屏
    (function () {
      var t = 'dark'
      try {
        var s = localStorage.getItem('th_theme')
        if (s === 'dark' || s === 'light') t = s
      } catch (e) {}
      document.documentElement.dataset.theme = t
      document.documentElement.classList.toggle('dark', t === 'dark')
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
