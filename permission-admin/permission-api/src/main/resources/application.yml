server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: permission-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:permission_admin}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  # 上传上限：必须大于 file.storage.avatar-max-size，否则 1~2MB 的图片会被容器
  # 直接拦成 500（Spring Boot multipart 默认只有 1MB）
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 默认输出 SQL 到 stdout（开发友好），生产环境通过 application-prod.yml 关闭
    log-impl: ${MYBATIS_PLUS_LOG:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  # 生产环境通过 application-prod.yml 关闭
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn

# JWT 密钥配置
# 优先级：jwt.secret 配置 > JWT_SECRET_KEY 环境变量 > 兜底默认值（仅开发）
jwt:
  secret: ${JWT_SECRET_KEY:}

# ===== 文件存储（头像上传）=====
# 生产环境建议挂独立数据盘并用 FILE_STORAGE_DIR 指定，
# 不要放在应用发布目录里（下次发版会被覆盖）
file:
  storage:
    dir: ${FILE_STORAGE_DIR:uploads}
    public-prefix: ${FILE_PUBLIC_PREFIX:/api/file}
    avatar-max-size: ${FILE_AVATAR_MAX_SIZE:2097152}
