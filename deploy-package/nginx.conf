server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml text/xml image/svg+xml;

    # API 代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 管理后台 (permission-ui)
    location ^~ /admin {
        alias /usr/share/nginx/html/permission-ui/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location ^~ /js/ {
        alias /usr/share/nginx/html/permission-ui/js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /assets/ {
        alias /usr/share/nginx/html/permission-ui/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 树洞前端 (treehole-web) - 放在 /treehole/ 路径下避免冲突
    location ^~ /treehole/ {
        alias /usr/share/nginx/html/treehole-web/;
        index index.html;
        try_files $uri $uri/ /treehole/index.html;
    }
    location ^~ /treehole/js/ {
        alias /usr/share/nginx/html/treehole-web/js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /treehole/assets/ {
        alias /usr/share/nginx/html/treehole-web/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 根路径重定向到树洞前端
    location = / {
        return 302 /treehole/;
    }
}
