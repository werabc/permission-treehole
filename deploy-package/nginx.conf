# 安全响应头 — 全局添加（覆盖所有 location）
# 注意：add_header 在 location 块内会覆盖父块，所以每个需要头部的 location 都要声明

# 捕获非匹配 Host 的请求，直接关闭连接（防 Host Header 注入）
server {
    listen 80 default_server;
    server_name _;
    return 444;  # 直接关闭连接，不返回任何内容
}

server {
    listen 80;
    # 生产环境请替换为真实域名：server_name yourdomain.com www.yourdomain.com;
    server_name _;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml text/xml image/svg+xml;

    # API 代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 管理后台 (permission-ui)
    location ^~ /admin {
        alias /usr/share/nginx/html/permission-ui/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # 安全响应头
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none';" always;
    }
    location ^~ /js/ {
        alias /usr/share/nginx/html/permission-ui/js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /assets/ {
        alias /usr/share/nginx/html/permission-ui/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 树洞前端 (treehole-web) - 放在 /treehole/ 路径下避免冲突
    location ^~ /treehole/ {
        alias /usr/share/nginx/html/treehole-web/;
        index index.html;
        try_files $uri $uri/ /treehole/index.html;

        # 安全响应头
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none';" always;
    }
    location ^~ /treehole/js/ {
        alias /usr/share/nginx/html/treehole-web/js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /treehole/assets/ {
        alias /usr/share/nginx/html/treehole-web/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 根路径重定向到树洞前端
    location = / {
        return 302 /treehole/;
    }

    # 自定义错误页，隐藏版本信息
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
